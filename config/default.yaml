# =========================================================================== #
# Eco-Loop — single source of truth for every tunable.
#
# Rule (AGENTS.md invariant): no threshold, limit, or cadence may be hard-coded
# in `src/`. If you find yourself typing a number into Python, it belongs here.
#
# Overriding, in increasing order of precedence:
#   1. this file
#   2. a profile from `config/profiles/` (`--profile fast|full|demo`)
#   3. an explicit `--config path.yaml`
#   4. environment variables, prefixed `ECOLOOP_` with `__` for nesting
#      e.g. ECOLOOP_LLM__MODEL=llama3.1:8b-instruct
#   5. `${ENV_VAR}` interpolation inside any string value here
# =========================================================================== #

project:
  name: eco-loop
  # Root for all run artefacts. One subdirectory per run_id.
  results_dir: results
  # Free disk required before an annual run is allowed to start (GiB).
  min_free_disk_gib: 5.0

# --------------------------------------------------------------------------- #
# Simulation engine
# --------------------------------------------------------------------------- #
simulation:
  backend: energyplus # energyplus | fake  (fake is the in-memory CI double)

  # Left null, Eco-Loop reads $ENERGYPLUS_DIR then auto-discovers standard
  # install locations per-OS. `pyenergyplus` is injected onto sys.path from here.
  energyplus_dir: null

  # API surface differs across versions; startup asserts this inclusive range
  # and fails with a clear message rather than crashing mid-run.
  min_version: "23.2.0"
  max_version: "26.99.0"

  idf_baseline: models/baseline/small_office.idf
  idf_prepared: models/prepared/small_office_prepared.idf
  weather: models/weather/USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw

  # Zone timesteps per hour. 4 is the F-requirement minimum; 6 gives the reflex
  # layer finer actuation without materially slowing the solver.
  timesteps_per_hour: 6

  run_period:
    begin_month: 1
    begin_day: 1
    end_month: 12
    end_day: 31

  # Warmup/sizing telemetry is physically meaningless — it never enters metrics
  # or LLM context. This flag exists only so a test can prove it is honoured.
  skip_warmup: true

  # Keep the .eso from exploding on annual timestep-frequency output.
  output:
    max_eso_mib: 2048
    keep_eplus_out: true
    # Written to disk on any handle failure so the operator can see real names.
    dump_available_api_data_on_error: true
    # .err content later reaches an LLM prompt as untrusted input; cap what
    # gets parsed rather than reading an unbounded file into memory.
    max_err_bytes: 2097152
    # get_weather_forecast() is a disclosed forecast oracle (docs/ARCHITECTURE.md),
    # capped so a careless call can't hand the model the rest of the year.
    max_forecast_horizon_hours: 72

# --------------------------------------------------------------------------- #
# Zones, comfort targets, and hard physical limits
# --------------------------------------------------------------------------- #
# Per-zone sensor/actuator wiring lives in `config/zones.yaml`.
comfort:
  standard: ashrae55

  # PMV band that defines "comfortable" during occupied hours (ASHRAE 55).
  pmv_occupied_min: -0.5
  pmv_occupied_max: 0.5
  # Wider band reported alongside as a secondary tolerance figure.
  pmv_tolerance_band: 0.7

  # Predicted Percentage Dissatisfied ceiling for compliance reporting.
  ppd_max_pct: 10.0

  # Indoor air quality: ASHRAE 62.1-flavoured CO2 ceiling for occupied hours.
  co2_max_ppm: 1000.0
  # Background outdoor CO2 assumed by the injected ZoneAirContaminantBalance
  # schedule (`prepare`). 400 ppm is the modern global-average ambient level.
  outdoor_co2_ppm: 400.0

  # Occupancy is derived from the IDF People schedule; a zone counts as
  # occupied when fractional occupancy exceeds this.
  occupied_threshold_fraction: 0.05

# --------------------------------------------------------------------------- #
# Guardrails — enforced in code, in the reflex layer, NEVER in the prompt.
# A compromised or hallucinating model cannot drive a zone outside these.
# --------------------------------------------------------------------------- #
guardrails:
  # Absolute setpoint envelope. Nothing the LLM emits escapes these.
  heating_setpoint_min_c: 15.0
  heating_setpoint_max_c: 23.0
  cooling_setpoint_min_c: 21.0
  cooling_setpoint_max_c: 30.0

  # Heating >= cooling causes simultaneous heating and cooling, which *raises*
  # energy use. A minimum deadband is enforced on every pair.
  min_deadband_c: 2.0

  # Anti-thrash: a model swinging setpoints hour to hour short-cycles equipment
  # and loses to baseline. Cap the rate of change and hold each change.
  max_setpoint_change_per_hour_c: 1.5
  min_hold_minutes: 30

  # Zone air temperature outside this is a hard alarm regardless of policy.
  zone_temp_alarm_min_c: 12.0
  zone_temp_alarm_max_c: 32.0

  # Lighting load-shed floor — never dim below this fraction while occupied.
  min_lighting_fraction_occupied: 0.6

# --------------------------------------------------------------------------- #
# Control layer
# --------------------------------------------------------------------------- #
control:
  controller: agent # baseline | rulebased | agent

  # Applied when no policy is active and as the final fallback rung.
  default_heating_setpoint_c: 21.0
  default_cooling_setpoint_c: 24.0
  unoccupied_heating_setpoint_c: 15.6
  unoccupied_cooling_setpoint_c: 29.4

  # Rolling-window electrical demand cap used by the peak-shaving logic.
  demand_cap_kw: 45.0
  demand_window_minutes: 15
  # Fraction of the cap that triggers a cognitive invocation.
  demand_trigger_fraction: 0.9

  rulebased:
    # ASHRAE Guideline 36-flavoured deterministic benchmark. This exists to
    # prove the LLM adds value beyond obvious heuristics — judges will ask.
    setback_enabled: true
    deadband_widening_unoccupied_c: 2.0
    economiser_enabled: true
    economiser_max_oat_c: 18.0
    economiser_min_oat_c: 4.0
    supply_air_reset_enabled: true
    supply_air_min_c: 12.0
    supply_air_max_c: 18.0
    precool_enabled: true
    precool_lead_hours: 2.0

# --------------------------------------------------------------------------- #
# Telemetry bus (Tier-1 → Tier-2)
# --------------------------------------------------------------------------- #
bus:
  # Fixed-size ring buffer. The EnergyPlus callback must NEVER block on a full
  # queue, so writes are put_nowait with drop-oldest; drops are counted and
  # surfaced in the run manifest.
  telemetry_capacity: 4096
  # Default aggregation window handed to the cognitive layer.
  aggregate_window_minutes: 60

  policy:
    # Time-to-live on every policy. On expiry the reflex layer degrades to the
    # rule-based controller, then to the building's native schedule.
    default_ttl_minutes: 90
    # A policy older than this is refused outright rather than applied stale.
    max_age_minutes: 180

# --------------------------------------------------------------------------- #
# Cognitive layer (Tier-2)
# --------------------------------------------------------------------------- #
agent:
  enabled: true

  # Fixed simulated-time cadence for supervisory invocation.
  cadence_minutes: 60
  # Rate limit shared by cadence and event triggers, to prevent thrash.
  min_invocation_gap_minutes: 15
  # Hard ceiling on tool calls per invocation; on cap a fallback policy is
  # applied and the no-progress condition is logged.
  max_tool_calls_per_invocation: 8

  triggers:
    pmv_excursion: true
    zone_temp_limit: true
    demand_approach: true
    carbon_spike: true
    severe_error: true
    # Carbon intensity above this (gCO2/kWh) is a spike.
    carbon_spike_gco2_per_kwh: 450.0

  context:
    # Enforced BEFORE dispatch, not discovered afterwards.
    max_input_tokens: 4000
    max_output_tokens: 800
    # Blocks are dropped from the tail of this list first when over budget.
    # Highest priority first — documented in docs/PROMPT_ENGINEERING.md.
    block_priority:
      - zone_summary
      - comfort_status
      - active_policy
      - energy_demand
      - alerts
      - grid_signal
      - reflection
      - weather_lookahead
      - occupancy_forecast
      - few_shot
    # Ceiling on any single tool result, enforced with explicit truncation notice.
    max_tool_result_tokens: 700
    # Rough chars-per-token used for pre-dispatch estimation.
    chars_per_token: 3.6

  selfheal:
    enabled: true
    max_retries: 3
    backoff_base_seconds: 2.0
    backoff_max_seconds: 30.0

# --------------------------------------------------------------------------- #
# LLM endpoint — any OpenAI-compatible server works by changing only this block
# --------------------------------------------------------------------------- #
llm:
  provider: ollama # ollama | openai_compatible
  base_url: "${ECOLOOP_LLM_BASE_URL:-http://localhost:11434}"
  model: qwen2.5:7b-instruct
  # Degradation target when the primary model is unavailable or too slow.
  fallback_model: qwen2.5:3b-instruct
  api_key_env: ECOLOOP_LLM_API_KEY

  # Reproducibility: greedy decoding plus a fixed seed. Any residual
  # non-determinism is documented honestly in docs/ARCHITECTURE.md.
  temperature: 0.0
  seed: 42
  top_p: 1.0
  num_ctx: 8192

  request_timeout_seconds: 120.0
  connect_timeout_seconds: 10.0

  retry:
    max_attempts: 3
    backoff_base_seconds: 1.0
    backoff_max_seconds: 20.0
    jitter_seconds: 0.5

  circuit_breaker:
    # Trip after N consecutive failures; half-open after the cooldown.
    failure_threshold: 5
    cooldown_seconds: 60.0
    half_open_max_calls: 1

  cache:
    # Keyed by SHA-256 of the rendered prompt. Makes the demo repeatable offline
    # and powers `--replay`.
    enabled: true
    dir: .ollama_cache
    max_entries: 5000

# --------------------------------------------------------------------------- #
# MCP server
# --------------------------------------------------------------------------- #
mcp:
  transport: stdio # stdio | http
  host: 127.0.0.1
  port: 8765
  server_name: ecoloop
  # Every path argument from a tool is resolved and asserted to sit inside one
  # of these roots. Rejects `..`, absolute escapes, and escaping symlinks.
  sandbox_roots:
    - models
    - results
    - config
  max_tool_result_bytes: 32768

# --------------------------------------------------------------------------- #
# Grid signals — shipped synthetic profiles, no internet dependency
# --------------------------------------------------------------------------- #
signals:
  carbon_intensity_csv: config/signals/carbon_intensity_hourly.csv
  tariff_csv: config/signals/tariff_tou.csv
  # Live fetching is an optional adapter, disabled by default: the judging
  # environment may be offline.
  live_fetch_enabled: false
  forecast_horizon_hours: 12

# --------------------------------------------------------------------------- #
# Analysis & reporting
# --------------------------------------------------------------------------- #
analysis:
  # EnergyPlus meters report JOULES. Divide by 3.6e6 for kWh. Get this wrong and
  # every number in the project is wrong.
  joules_per_kwh: 3600000.0

  # Sanity envelope for a small office; a run outside this is flagged implausible
  # rather than silently reported.
  plausible_annual_kwh_per_m2_min: 40.0
  plausible_annual_kwh_per_m2_max: 400.0

  # Colour-blind-safe (Okabe-Ito derived). Charts are graded.
  palette:
    baseline: "#E69F00"
    rulebased: "#56B4E9"
    agent: "#009E73"
    comfort_band: "#CCCCCC"
    violation: "#D55E00"
    grid_carbon: "#CC79A7"

  report:
    # Plotly offline, single self-contained file, opens with no server.
    embed_plotly_js: true
    title: "Eco-Loop — Autonomous Building Control Results"

# --------------------------------------------------------------------------- #
# Logging
# --------------------------------------------------------------------------- #
logging:
  level: INFO
  # JSON to file, Rich-rendered to console.
  json_file: true
  console_rich: true
  # Trace and log files are capped; a runaway agent hits a wall, not the disk.
  max_log_mib: 256
  max_trace_mib: 128
